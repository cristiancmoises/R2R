name: R2R JS SDK Integration CI

on:
  push:
    branches: [main]
    paths:
      - 'js/sdk/**'
  pull_request:
    branches: [main]
    paths:
      - 'js/sdk/**'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./js/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and verify runtime security regressions
        run: pnpm run test:security
